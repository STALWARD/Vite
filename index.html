<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Preconnect to external font domains -->
    <link rel="preconnect" href="https://fonts.cdnfonts.com" crossorigin>

    <!-- Preload critical fonts -->
    <link rel="preload" href="/fonts/zentry-regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/general.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/robert-regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/circularweb-book.woff2" as="font" type="font/woff2" crossorigin>

    <!-- Preload hero image -->
    <link rel="preload" fetchpriority="high" as="image" href="/img/intro.webp" type="image/webp">

    <!-- Inline critical CSS -->
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
      }
      header {
        background: #fff;
        padding: 1rem;
      }
    </style>

    <title>my-app</title>
  </head>
  <body>
    <div id="root"></div>

    <!-- Vite will inject built CSS/JS automatically -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
